# Included inside http{} via conf.d. Cookie gates a one-time Clear-Site-Data
# wipe so normal Chrome profiles drop stale HTTP cache / Cache API / SW state.
# Bump the expected value in default.conf when you need another forced wipe.
map $cookie_astrans_cv $astrans_clear_site {
    default "\"cache\", \"storage\"";
    "8"     "";
}
