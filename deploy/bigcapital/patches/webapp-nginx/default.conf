server {
    listen 80 default_server;

    # Manual reset only — do NOT Clear-Site-Data on normal HTML.
    # Clearing storage on every visit wiped auth/session and broke login.
    location = /__astrans_reset {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data "\"cache\", \"storage\", \"executionContexts\"" always;
        return 200 '<!doctype html><meta charset="utf-8"><title>Resetting…</title><script>try{if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}sessionStorage.clear()}catch(e){}setTimeout(function(){location.replace("/auth/login")},400)</script><p>Clearing cached Astrans Books data…</p>';
    }

    location = /index.html {
        root /usr/share/nginx/html;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # Old CRA service workers: 410 so browsers unregister. No Clear-Site-Data here.
    location ~* ^/(service-worker\.js|sw\.js|precache-manifest.*\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-store" always;
        return 410;
    }

    location ~* ^/brand/astrans-inject-[0-9]+\.js$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /brand/ {
        root /usr/share/nginx/html;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Patched SPA chunks: never let Cloudflare/browser keep a stale copy.
    # (Same filename as stock; content differs — long CDN cache makes prefs look "unsaved".)
    location = /assets/index-C4jBpDeP.js {
        root /usr/share/nginx/html;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /assets/General-CydUBvrk.js {
        root /usr/share/nginx/html;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }


    location = /assets/AuthenticationPage-ChWNzyET.js {
