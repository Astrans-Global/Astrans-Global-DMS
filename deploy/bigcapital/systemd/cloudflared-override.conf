# /etc/systemd/system/cloudflared.service.d/override.conf
# QUIC/UDP flaps through VirtualBox NAT after reboot; cloudflared's own
# precheck recommends http2 here. Also never give up restarting.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
Environment=TUNNEL_TRANSPORT_PROTOCOL=http2
